# ==============================================================================
# Nginx Hardened Configuration — Topologia self-hosted VPS
# HH Offshore · Infotec Brasil
# ==============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Oculta assinatura de versão do Nginx (CWE-200)
    server_tokens off;

    # Formato de log estruturado para auditoria corporativa
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # Otimizações de I/O de rede
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Tamanho máximo de payload para requisições (importação de planilhas até 15 MB)
    client_max_body_size 25M;

    # Compressão de alta eficiência para artefatos estáticos e respostas JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Upstream isolado para o serviço Node.js Backend na rede interna Docker
    upstream backend_api {
        server backend:3000;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Servidor HTTP (Porta 80) — Tráfego Direto ou Atrás de Reverse Proxy / Cloudflare
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Headers de Segurança Corporativos (Topologia self-hosted sem origens Supabase externas)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' data: blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

        # ----------------------------------------------------------------------
        # 1. Assets estáticos compilados pelo Vite (/assets/*)
        # Com hashing imutável (ex: index-D8f2A.js) — Cache imutável por 1 ano
        # ----------------------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }

        # Demais arquivos estáticos públicos com hash menor (ícones, manifestos, imagens)
        location ~* \.(?:ico|png|svg|webp|webmanifest|txt)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # 2. Rota dedicada Server-Sent Events (SSE) para Realtime
        # Requer buffering desativado e timeout estendido para conexões persistentes
        # ----------------------------------------------------------------------
        location /api/v1/realtime/events {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            # Desativação obrigatória de buffers para transmissão instantânea de eventos
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Timeout de 24h para manter o canal SSE aberto sem desconexão espúria
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Headers essenciais para streaming HTTP/1.1
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Preservação de cookies de autenticação da sessão SSE
            proxy_pass_header Set-Cookie;
            proxy_pass_header Cookie;
        }

        # ----------------------------------------------------------------------
        # 3. Proxy Reverso para a API REST (/api/v1/*)
        # Encaminha chamadas ao container backend preservando cookies HttpOnly e CSRF
        # ----------------------------------------------------------------------
        location /api/v1/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            # Encaminhamento fiel de cabeçalhos de cliente e rede
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Preservação estrita dos cabeçalhos de Cookie (Sessão Stateful HttpOnly)
            proxy_pass_header Set-Cookie;
            proxy_pass_header Cookie;

            # Timeouts adequados para processamento de lote e consultas analíticas
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # 4. Roteamento da SPA (Single Page Application) e index.html
        # Não armazena cache do HTML principal para garantir deployments sem lag
        # ----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;

            # Garante que o index.html sempre seja revalidado a cada navegação
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;

            # Reafirma os headers de segurança na entrega do index.html
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' data: blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        }
    }

