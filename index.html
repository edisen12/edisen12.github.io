    <script>
      (function(){
        try {
          var t = localStorage.getItem('hhoff_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', t);
        } catch(e){}
      })();
    </script>
